[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.21"
hilt                    = "2.51.1"
ksp                     = "2.0.21-1.0.27"
compose-bom             = "2024.09.03"
camerax                 = "1.3.4"
mlkit-text              = "16.0.1"
mediapipe-tasks-genai   = "0.10.22"
room                    = "2.6.1"
coroutines              = "1.8.1"
lifecycle               = "2.8.6"
navigation-compose      = "2.8.2"
kotlinx-serialization   = "1.7.3"
hilt-navigation-compose = "1.2.0"
# Extras pulled in transitively / directly
activity-compose        = "1.9.2"
core-ktx                = "1.13.1"
appcompat               = "1.7.0"
material3               = "1.3.0"
junit                   = "4.13.2"
junit-ext               = "1.2.1"
espresso                = "3.6.1"

[plugins]
android-application    = { id = "com.android.application",            version.ref = "agp"    }
android-library        = { id = "com.android.library",               version.ref = "agp"    }
kotlin-android         = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",     version.ref = "hilt"   }
ksp                    = { id = "com.google.devtools.ksp",            version.ref = "ksp"    }

[libraries]
# ── Kotlin / Coroutines ──────────────────────────────────────────────────────
kotlin-stdlib                   = { group = "org.jetbrains.kotlin",     name = "kotlin-stdlib",                  version.ref = "kotlin"       }
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",     version.ref = "coroutines"   }
kotlinx-coroutines-core         = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-core",        version.ref = "coroutines"   }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",     version.ref = "kotlinx-serialization" }

# ── AndroidX Core ────────────────────────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",            name = "core-ktx",                       version.ref = "core-ktx"     }
androidx-appcompat              = { group = "androidx.appcompat",        name = "appcompat",                      version.ref = "appcompat"    }
androidx-activity-compose       = { group = "androidx.activity",         name = "activity-compose",               version.ref = "activity-compose" }

# ── Compose BOM + UI ─────────────────────────────────────────────────────────
androidx-compose-bom            = { group = "androidx.compose",          name = "compose-bom",                    version.ref = "compose-bom"  }
androidx-compose-ui             = { group = "androidx.compose.ui",       name = "ui"                                                          }
androidx-compose-ui-graphics    = { group = "androidx.compose.ui",       name = "ui-graphics"                                                 }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",  name = "ui-tooling-preview"                                          }
androidx-compose-ui-tooling     = { group = "androidx.compose.ui",       name = "ui-tooling"                                                  }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui",       name = "ui-test-junit4"                                              }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui",     name = "ui-test-manifest"                                            }
androidx-compose-material3      = { group = "androidx.compose.material3", name = "material3",                     version.ref = "material3"    }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Lifecycle / ViewModel ────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx        = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }

# ── Navigation ───────────────────────────────────────────────────────────────
androidx-navigation-compose     = { group = "androidx.navigation",       name = "navigation-compose",              version.ref = "navigation-compose" }

# ── Hilt DI ──────────────────────────────────────────────────────────────────
hilt-android                    = { group = "com.google.dagger",         name = "hilt-android",                   version.ref = "hilt"         }
hilt-android-compiler           = { group = "com.google.dagger",         name = "hilt-android-compiler",          version.ref = "hilt"         }
hilt-navigation-compose         = { group = "androidx.hilt",             name = "hilt-navigation-compose",        version.ref = "hilt-navigation-compose" }

# ── Room ─────────────────────────────────────────────────────────────────────
androidx-room-runtime           = { group = "androidx.room",             name = "room-runtime",                   version.ref = "room"         }
androidx-room-ktx               = { group = "androidx.room",             name = "room-ktx",                       version.ref = "room"         }
androidx-room-compiler          = { group = "androidx.room",             name = "room-compiler",                  version.ref = "room"         }

# ── CameraX ──────────────────────────────────────────────────────────────────
androidx-camera-core            = { group = "androidx.camera",           name = "camera-core",                    version.ref = "camerax"      }
androidx-camera-camera2         = { group = "androidx.camera",           name = "camera-camera2",                 version.ref = "camerax"      }
androidx-camera-lifecycle       = { group = "androidx.camera",           name = "camera-lifecycle",               version.ref = "camerax"      }
androidx-camera-view            = { group = "androidx.camera",           name = "camera-view",                    version.ref = "camerax"      }

# ── ML Kit ───────────────────────────────────────────────────────────────────
mlkit-text-recognition          = { group = "com.google.mlkit",          name = "text-recognition",               version.ref = "mlkit-text"   }

# ── MediaPipe / Gemma on-device ──────────────────────────────────────────────
mediapipe-tasks-genai           = { group = "com.google.mediapipe",      name = "tasks-genai",                    version.ref = "mediapipe-tasks-genai" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit                           = { group = "junit",                     name = "junit",                          version.ref = "junit"        }
androidx-junit                  = { group = "androidx.test.ext",         name = "junit",                          version.ref = "junit-ext"    }
androidx-espresso-core          = { group = "androidx.test.espresso",    name = "espresso-core",                  version.ref = "espresso"     }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",        version.ref = "coroutines"   }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-activity-compose",
]
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
]
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core",
]
